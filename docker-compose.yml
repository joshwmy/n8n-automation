# Phase 1 local n8n runtime — Méhua Deposit Concierge prototype.
#
# Minimal by design: one n8n container, SQLite (n8n's own built-in default
# database — no Postgres, since Phase 1 uses Google Sheets as the
# operational datastore, not n8n's internal DB), one named volume for
# persistence, no reverse proxy, no tunnel, no other services.
#
# Bound to 127.0.0.1 only — not reachable from the LAN and never
# tunneled/exposed publicly. See .env.example for every variable this
# file reads; copy it to .env (gitignored) and fill in real values.

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:?Set N8N_VERSION in .env — see .env.example}
    restart: unless-stopped
    ports:
      # Host-side bind is 127.0.0.1 only — do not change this to "5678:5678"
      # (that would bind 0.0.0.0 and expose n8n on the LAN).
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env — see .env.example}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-UTC}
      - TZ=${TZ:-UTC}
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=${N8N_PORT:-5678}
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE:-false}
      - CLIENT_CONFIG_JSON=${CLIENT_CONFIG_JSON:?Set CLIENT_CONFIG_JSON in .env — generate it with scripts/render-client-env.js}
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      # BusyBox wget, which the image ships at /usr/bin/wget. It exits non-zero
      # on a non-2xx status, so reaching /healthz IS the check.
      #
      # This deliberately does NOT shell out to `node`: spawning a second Node
      # process costs ~0.36s even when idle, and intermittently blew past a 5s
      # timeout while n8n was busy starting up - flipping the container to
      # "unhealthy" while HTTP was in fact answering 200 the whole time.
      # wget costs ~0.01s.
      #
      # start_period covers first boot, where n8n runs its DB migrations
      # before it starts listening; failures in that window are not counted.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  n8n_data:
    # Named volume, not a bind mount — nothing is written into the repo
    # tree by running this stack.
